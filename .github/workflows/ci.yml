# Build, test, tag/release and publish craft-epsilon (adapted from MoleculeResolver/molecule-resolver).
#
# Every push builds the package and runs the fast tests on the built wheel. If the version in pyproject.toml is
# not yet on PyPI, a push to main tags the commit, creates a GitHub release and publishes to PyPI; a push to any
# other branch publishes to TestPyPI instead. Publishing uses PyPI trusted publishing (no token): register the
# workflow once as a (pending) trusted publisher on pypi.org and test.pypi.org
# (owner simonmb, repository craft-epsilon, workflow ci.yml).
on:
  push:
  pull_request:
    branches:
      # Branches from forks have the form 'user:branch-name'; only those run on pull_request events, so
      # PRs from branches of this repository are not built twice.
    - '**:**'


jobs:
  # Build the package (sdist and wheel)
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    - name: Save built package
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 1


  # Run the fast tests (no xtb, no network) on the built wheel
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: "pyproject.toml"

    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Install package and test dependencies
      shell: bash
      run: pip install dist/craft_epsilon-*.whl pytest

    - name: Run tests
      shell: bash
      # tests import the installed wheel, not the checkout
      run: |
        rm -rf craft_epsilon
        pytest


  # Tag and release the package if its version is not yet on PyPI
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Determine the version of this build
      id: current
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version of build: $VERSION"

    - name: Get latest published version
      id: published
      run: |
        PUB_VER=$(python -c "
        import json, urllib.request, urllib.error
        try:
            print(json.load(urllib.request.urlopen('https://pypi.org/pypi/craft-epsilon/json'))['info']['version'])
        except urllib.error.HTTPError:
            print('none')")
        echo "version=$PUB_VER" >> $GITHUB_OUTPUT
        echo "Latest published version: $PUB_VER"

    - name: Tag repository
      shell: bash
      if: (steps.current.outputs.version != steps.published.outputs.version)
      run: |
        TAG_NAME=${{ steps.current.outputs.version }}
        echo "This release will be tagged as $TAG_NAME"
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        git tag --annotate --message="Automated tagging system" $TAG_NAME ${{ github.sha }}

    - name: Push the tag
      if: (steps.current.outputs.version != steps.published.outputs.version)
      id: push_tag
      env:
        TAG_NAME: ${{ steps.current.outputs.version }}
      run: |
        if [[ ${{ github.ref_name }} == 'main' ]]; then
          git push origin $TAG_NAME
          echo "should_release=true" >> $GITHUB_OUTPUT
        else
          echo "If this was the main branch, I would push a new tag named $TAG_NAME"
          echo "should_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Wait for GitHub to register the tag
      run: sleep 10

    - name: Release
      uses: softprops/action-gh-release@v2
      if: ${{ steps.push_tag.outputs.should_release == 'true' }}
      with:
        tag_name: ${{ steps.current.outputs.version }}
        files: dist/craft_epsilon-${{ steps.current.outputs.version }}.tar.gz

    outputs:
      publish_pypi: ${{ steps.push_tag.outputs.should_release }}
      publish_test_pypi: ${{ (steps.current.outputs.version != steps.published.outputs.version) && github.ref_name != 'main' }}


  # Publish the package to PyPI (main) or TestPyPI (other branches)
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI if new version
      env:
        should_publish: ${{ needs.release.outputs.publish_pypi }}
      if: ${{ env.should_publish == 'true' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

    - name: Publish to TestPyPI if new version not on main
      env:
        should_publish: ${{ needs.release.outputs.publish_test_pypi }}
      if: ${{ env.should_publish == 'true' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
